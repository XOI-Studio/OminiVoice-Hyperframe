<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <script src="./assets/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #0a0a0a; }
      #root { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; font-family: sans-serif; }
      #title { color: #f4f4f5; font-size: 64px; font-weight: 600; }
      #card { width: 480px; height: 270px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="1280" data-height="720">
      <h1 id="title" class="clip" data-start="0" data-duration="2" data-track-index="0">Xin chào HyperFrames</h1>
      <img id="card" class="clip" src="./assets/card.png" data-start="0" data-duration="2" data-track-index="1" />
      <audio id="voice" src="./assets/voice.wav" data-start="0" data-duration="2" data-track-index="2"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#title", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.6 }, 0);
      tl.fromTo("#card", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.3);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
